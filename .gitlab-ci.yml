# 仓库根/.gitlab-ci.yml
stages: [check, test, build, deploy]

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository"
  IMAGE: "${CI_REGISTRY_IMAGE}/app:${CI_COMMIT_SHORT_SHA}"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository/

compile-check:
  stage: check
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn -B -f backend/pom.xml -DskipTests compile

unit-test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn -B -f backend/pom.xml test
  artifacts:
    when: always
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml

build-image:
  stage: build
  image: docker:24
  services: [docker:24-dind]
  script:
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
    - docker build -t "${IMAGE}" -f backend/Dockerfile ./backend
    - docker push "${IMAGE}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

deploy-dev:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "${DEV_SSH_KEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "${DEV_HOST}" >> ~/.ssh/known_hosts
  script:
    - ssh deploy@${DEV_HOST} "cd /opt/app && IMAGE_TAG=${IMAGE} docker compose pull app && IMAGE_TAG=${IMAGE} docker compose up -d --no-deps app"
  environment: { name: development }
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

deploy-prod:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "${PROD_SSH_KEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "${PROD_HOST}" >> ~/.ssh/known_hosts
  script:
    - ssh deploy@${PROD_HOST} "cd /opt/app && IMAGE_TAG=${IMAGE} docker compose pull app && IMAGE_TAG=${IMAGE} docker compose up -d --no-deps app"
  environment: { name: production }
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
