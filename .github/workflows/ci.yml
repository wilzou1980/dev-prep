name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/app

permissions:
  contents: read
  packages: write

jobs:
  compile-check:
    name: 编译检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 编译
        run: mvn -B -f backend/pom.xml -DskipTests compile

  unit-test:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: compile-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 测试
        run: mvn -B -f backend/pom.xml test
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/TEST-*.xml

  build-image:
    name: 构建并推送镜像到 GHCR
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: 部署 dev（手动放行）
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main'
    environment: development
    steps:
      - name: 通过 SSH 拉取并重启应用
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: deploy
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            cd /opt/app
            IMAGE_TAG=${{ env.IMAGE }}:${{ github.sha }} docker compose pull app
            IMAGE_TAG=${{ env.IMAGE }}:${{ github.sha }} docker compose up -d --no-deps app

  deploy-prod:
    name: 部署 prod（tag 手动放行）
    runs-on: ubuntu-latest
    needs: build-image
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: 通过 SSH 拉取并重启应用
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/app
            IMAGE_TAG=${{ env.IMAGE }}:${{ github.sha }} docker compose pull app
            IMAGE_TAG=${{ env.IMAGE }}:${{ github.sha }} docker compose up -d --no-deps app
